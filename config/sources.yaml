research:
  provider: "google_news_rss"
  language: "ja-JP"
  region: "JP"
  max_items_per_query: 4
  max_total_items: 10
  freshness_half_life_hours: 18
  search_window_days: 3
  max_age_hours: 96
  max_items_per_source: 2
  prefer_category_diversity: true
  min_score: 20
  preferred_sources: ["日本経済新聞", "ロイター", "ブルームバーグ", "NHK", "時事通信", "株探", "会社四季報オンライン", "Reuters", "Bloomberg"]
  excluded_sources: ["note"]
  penalized_sources: ["Yahoo!ファイナンス", "みんかぶ", "Investing.com"]
  penalized_title_patterns: ["株価・株式情報", "夜間PTS", "掲示板", "ADR日本株ランキング", "投信", "ETF", "ランキング", "指数情報・推移", "無料書き起こし"]
  excluded_title_patterns: ["ログイン", "広告", "PR TIMES", "株価・株式情報", "夜間PTS", "掲示板", "指数情報・推移", "無料書き起こし"]
  importance_keywords:
    macro: ["FRB", "FOMC", "金利", "米10年", "雇用", "CPI", "PCE", "ドル", "円", "原油", "VIX"]
    japan_market: ["日経平均", "TOPIX", "半導体", "銀行", "為替", "決算", "上方修正", "下方修正", "レーティング", "需給"]
    fx: ["ドル円", "円", "日銀", "FRB", "米金利", "介入", "CPI", "雇用統計"]
    earnings: ["決算", "上方修正", "下方修正", "増益", "減益", "営業利益", "通期"]
    default: ["株", "為替", "金利", "決算", "原油", "リスク"]
  material_categories:
    金利・金融政策: ["FRB", "FOMC", "日銀", "金利", "米10年", "利回り", "政策金利"]
    為替: ["ドル円", "円高", "円安", "円相場", "ドル", "為替", "介入"]
    決算・業績: ["決算", "上方修正", "下方修正", "増益", "減益", "営業利益", "通期"]
    需給・レーティング: ["レーティング", "需給", "信用", "空売り", "買い残", "売り残"]
    セクター材料: ["半導体", "銀行", "自動車", "商社", "不動産", "AI", "防衛"]
    リスク・地政学: ["原油", "中東", "地政学", "関税", "VIX", "リスク"]
  default_queries:
    macro:
      - "米国株 金利 為替 原油 市場"
      - "FOMC FRB 金利 ドル 円 日本株"
      - "VIX 米国債利回り 日経平均"
      - "米国 経済指標 CPI PCE 雇用 FRB 今日"
      - "原油 金 ドル指数 VIX 米国株 今日"
    japan_market:
      - "日経平均 日本株 今日 材料"
      - "東京市場 寄り付き 半導体 銀行 円相場"
      - "日本株 決算 レーティング 需給"
